<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs | Nirmal</title>
  <link rel="stylesheet" href="styles.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="ce504de4-049a-4136-822e-1dd5702c2376"></script>
</head>

<body class="min-h-screen bg-[var(--base)] text-[var(--text)] font-system-ui leading-relaxed">
  <div class="mx-auto max-w-[1100px] px-4 py-8 sm:px-6">
    <header class="mb-8">
      <a href="/"
        class="inline-block text-[var(--muted)] no-underline mb-6 hover:text-[var(--text)] transition-colors duration-200">
        ← Back to home
      </a>
      <h1 class="text-4xl font-bold text-[var(--iris)] mb-4">
        Logs & Experiments
      </h1>
      <p class="text-[var(--muted)]">
        Short notes, lessons, and wild ideas I'm scribbling down
      </p>
    </header>

    <div class="flex flex-col lg:flex-row lg:gap-10 lg:items-start">
      <aside class="mb-10 lg:mb-0 lg:w-64 lg:flex-shrink-0 lg:sticky lg:top-8">
        <p class="text-xs uppercase tracking-widest text-[var(--muted)] mb-3 font-semibold">
          All logs
        </p>
        <nav id="list"></nav>
      </aside>

      <!-- Main content -->
      <main class="flex-1 min-w-0">
        <div id="content"
          class="bg-[var(--surface)] border border-[var(--overlay)] rounded-lg p-6 prose prose-invert max-w-none">
          <p class="text-[var(--muted)] italic">
            Select a log from the list to read it here…
          </p>
        </div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
